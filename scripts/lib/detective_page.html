<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 侦探 · 先查再说</title>
<style>
  :root { --bg:#f6f4ef; --ink:#1f2328; --mute:#6b7280; --card:#fff; --line:#e5e1d8;
          --true:#1a7f4b; --false:#c0392b; --maybe:#b7791f; --none:#5b6472; --accent:#2b4c7e; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font:16px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif; }
  main { max-width:760px; margin:0 auto; padding:40px 20px 80px; }
  h1 { font-size:28px; margin:0 0 4px; letter-spacing:.5px; }
  .sub { color:var(--mute); margin:0 0 24px; }
  form { display:flex; gap:8px; }
  input[type=text] { flex:1; padding:12px 14px; font-size:16px; border:1px solid var(--line);
                     border-radius:8px; background:#fff; }
  input[type=text]:focus { outline:2px solid var(--accent); outline-offset:1px; }
  button { padding:12px 20px; font-size:16px; border:0; border-radius:8px; background:var(--accent);
           color:#fff; cursor:pointer; }
  button:disabled { opacity:.5; cursor:wait; }
  .examples { margin:12px 0 0; font-size:14px; color:var(--mute); }
  .examples button { padding:2px 8px; margin:2px 4px 2px 0; font-size:14px; background:#fff;
                     color:var(--accent); border:1px solid var(--line); border-radius:14px; }
  #progress { margin:24px 0 0; color:var(--mute); }
  #error { margin:24px 0 0; padding:12px 14px; border-radius:8px; background:#fdecea; color:#8a1f17; }
  .card { margin-top:24px; background:var(--card); border:1px solid var(--line); border-radius:12px;
          padding:22px; }
  .badge { display:inline-block; padding:4px 14px; border-radius:16px; color:#fff; font-weight:600; }
  .v-真 { background:var(--true); } .v-假 { background:var(--false); }
  .v-说不准 { background:var(--maybe); } .v-没查到可靠来源 { background:var(--none); }
  .claim { margin:12px 0 4px; font-size:18px; font-weight:600; }
  .reason { margin:8px 0 0; }
  h2 { font-size:15px; margin:20px 0 6px; color:var(--mute); font-weight:600; }
  ul { margin:0; padding-left:20px; }
  li { margin:4px 0; }
  a { color:var(--accent); word-break:break-all; }
  .meta { font-size:13px; color:var(--mute); }
  .conflict { background:#fbf6e9; border-left:3px solid var(--maybe); padding:8px 12px; margin:6px 0; }
  .note { font-size:13px; color:var(--mute); }
  details { margin-top:14px; }
  summary { cursor:pointer; color:var(--mute); font-size:14px; }
  footer { margin-top:32px; font-size:13px; color:var(--mute); }
  button.linkish { padding:0; font-size:13px; background:none; color:var(--accent);
                   text-decoration:underline; border-radius:0; }
</style>
</head>
<body>
<main>
  <h1>AI 侦探</h1>
  <p class="sub">先查,再说。查得到就亮出处,查不到就老实说不知道。</p>
  <form id="form">
    <input type="text" id="q" maxlength="200" autocomplete="off"
           placeholder="粘贴一条传言,或描述你想查的事" aria-label="要查证的内容">
    <button type="submit" id="go">开查</button>
  </form>
  <div class="examples">试试:
    <span id="examples"></span>
  </div>
  <div id="progress" role="status" aria-live="polite"></div>
  <div id="error" role="alert" hidden></div>
  <div id="result"></div>
  <footer>搜索由元宝搜索提供。结论仅依据查到的来源,请点开来源自行核对。不查时政话题和个人私事。</footer>
</main>
<script src="/app.js"></script>
</body>
</html>
