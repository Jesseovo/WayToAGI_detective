<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f5f0e7">
<title>AI 侦探 · 先查再说</title>
<style>
  :root {
    --bg: #f5f0e7;
    --paper: rgba(255, 253, 248, .92);
    --paper-solid: #fffdf8;
    --ink: #1c2934;
    --muted: #71808b;
    --soft: #a7b0b4;
    --line: #e5ded2;
    --navy: #173a5e;
    --navy-deep: #102b47;
    --gold: #d89d3c;
    --true: #237653;
    --false: #bd4b3d;
    --maybe: #b47725;
    --none: #66727c;
    --shadow: 0 24px 70px rgba(36, 49, 55, .09);
  }
  * { box-sizing: border-box; }
  html { min-width: 320px; }
  body {
    min-height: 100vh; margin: 0; color: var(--ink);
    background: radial-gradient(circle at 10% 8%, rgba(216,157,60,.12), transparent 27rem), radial-gradient(circle at 90% 20%, rgba(23,58,94,.08), transparent 30rem), repeating-linear-gradient(0deg, rgba(74,65,48,.018) 0, rgba(74,65,48,.018) 1px, transparent 1px, transparent 5px), var(--bg);
    font: 16px/1.65 -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  button, input { font: inherit; }
  button { -webkit-tap-highlight-color: transparent; }
  a { color: var(--navy); }
  .page-shell { width: min(1080px, calc(100% - 40px)); margin: 0 auto; padding: 28px 0 58px; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-bottom: 44px; }
  .brand { display: inline-flex; align-items: center; gap: 12px; color: var(--ink); text-decoration: none; }
  .brand-mark { position: relative; display: grid; width: 38px; height: 38px; place-items: center; border-radius: 13px; color: #fff; background: var(--navy); box-shadow: 0 9px 20px rgba(23,58,94,.2); }
  .brand-mark::before { content: ""; width: 14px; height: 14px; border: 2px solid currentColor; border-radius: 50%; transform: translate(-2px,-2px); }
  .brand-mark::after { content: ""; position: absolute; width: 9px; height: 2px; border-radius: 2px; background: currentColor; transform: translate(8px,9px) rotate(45deg); }
  .brand-name { font-size: 17px; font-weight: 750; letter-spacing: .02em; }
  .brand-caption { display: block; margin-top: -2px; color: var(--muted); font-size: 12px; font-weight: 500; letter-spacing: .06em; }
  .top-note { display: inline-flex; align-items: center; gap: 7px; color: var(--muted); font-size: 13px; }
  .live-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 0 5px rgba(216,157,60,.13); }
  .hero { display: grid; grid-template-columns: minmax(0,1.1fr) minmax(280px,.9fr); gap: 28px; align-items: stretch; margin-bottom: 26px; }
  .hero-copy { padding: 18px 0 22px; }
  .eyebrow { display: inline-flex; align-items: center; gap: 9px; margin: 0 0 17px; color: var(--navy); font-size: 12px; font-weight: 750; letter-spacing: .14em; text-transform: uppercase; }
  .eyebrow::before { content: ""; width: 30px; height: 1px; background: var(--gold); }
  h1 { max-width: 680px; margin: 0; color: var(--navy-deep); font-size: clamp(40px,6vw,72px); line-height: 1.08; letter-spacing: -.055em; }
  .hero-copy > p { max-width: 530px; margin: 20px 0 0; color: var(--muted); font-size: 18px; line-height: 1.75; }
  .hero-art { position: relative; min-height: 278px; overflow: hidden; border: 1px solid rgba(23,58,94,.1); border-radius: 30px; background: linear-gradient(145deg,#204b70,#122d4c); box-shadow: var(--shadow); }
  .hero-art::before { content: ""; position: absolute; inset: 0; opacity: .35; background: repeating-linear-gradient(135deg, rgba(255,255,255,.08) 0 1px, transparent 1px 11px); }
  .hero-art::after { content: ""; position: absolute; right: -20%; bottom: -45%; width: 100%; aspect-ratio: 1; border: 1px solid rgba(255,255,255,.18); border-radius: 50%; box-shadow: 0 0 0 34px rgba(255,255,255,.04), 0 0 0 70px rgba(255,255,255,.035); }
  .orbit { position: absolute; top: 41px; left: 48px; width: 142px; height: 142px; border: 1px solid rgba(255,255,255,.33); border-radius: 50%; }
  .orbit::before, .orbit::after { content: ""; position: absolute; border-radius: 50%; background: var(--gold); box-shadow: 0 0 0 8px rgba(216,157,60,.16), 0 0 30px rgba(216,157,60,.55); }
  .orbit::before { top: 12px; right: 6px; width: 10px; height: 10px; }
  .orbit::after { right: 22px; bottom: 18px; width: 6px; height: 6px; opacity: .72; }
  .hero-art-copy { position: absolute; right: 30px; bottom: 30px; left: 30px; color: #fff; }
  .hero-art-kicker { margin: 0 0 7px; color: #e8c983; font-size: 12px; letter-spacing: .14em; }
  .hero-art-title { margin: 0; font-size: 25px; font-weight: 700; letter-spacing: -.02em; }
  .hero-art-line { width: 76px; height: 3px; margin-top: 17px; border-radius: 5px; background: var(--gold); }
  .search-card { position: relative; z-index: 1; padding: 23px; border: 1px solid rgba(216,157,60,.2); border-radius: 22px; background: var(--paper); box-shadow: 0 14px 45px rgba(60,54,44,.08); backdrop-filter: blur(10px); }
  .search-card-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 13px; }
  .search-card-title { margin: 0; color: var(--navy-deep); font-size: 16px; font-weight: 750; }
  .search-card-hint { color: var(--muted); font-size: 12px; }
  form { display: flex; gap: 10px; }
  input[type=text] { min-width: 0; flex: 1; padding: 14px 16px; color: var(--ink); border: 1px solid #d9d4ca; border-radius: 13px; outline: none; background: #fffefa; box-shadow: inset 0 1px 2px rgba(40,42,36,.03); transition: border-color .2s, box-shadow .2s, background .2s; }
  input[type=text]::placeholder { color: #a5aaa9; }
  input[type=text]:focus { border-color: var(--navy); background: #fff; box-shadow: 0 0 0 4px rgba(23,58,94,.1); }
  button { border: 0; border-radius: 12px; cursor: pointer; }
  #go { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-width: 92px; padding: 0 19px; color: #fff; font-weight: 700; background: var(--navy); box-shadow: 0 9px 17px rgba(23,58,94,.2); transition: transform .18s, background .18s, box-shadow .18s; }
  #go::after { content: "↗"; font-size: 18px; line-height: 1; }
  #go:hover { background: #0f2b48; box-shadow: 0 12px 22px rgba(23,58,94,.26); transform: translateY(-1px); }
  #go:disabled { opacity: .55; cursor: wait; transform: none; }
  .examples { display: flex; flex-wrap: wrap; align-items: center; gap: 7px; margin-top: 15px; color: var(--muted); font-size: 12px; }
  .examples-label { margin-right: 2px; color: var(--soft); }
  .examples button { padding: 6px 10px; color: #52616b; border: 1px solid var(--line); border-radius: 999px; background: rgba(255,255,255,.72); font-size: 12px; transition: color .18s, border-color .18s, background .18s, transform .18s; }
  .examples button:hover { color: var(--navy); border-color: #b9c4c8; background: #fff; transform: translateY(-1px); }
  #progress { display: flex; align-items: center; gap: 10px; margin: 20px 0 0; padding: 13px 16px; color: var(--navy); border: 1px solid #dbe2e3; border-radius: 12px; background: rgba(239,245,244,.78); font-size: 14px; }
  #progress:empty { display: none; }
  #progress:not(:empty)::before { content: ""; width: 14px; height: 14px; flex: 0 0 auto; border: 2px solid #b6c7cd; border-top-color: var(--navy); border-radius: 50%; animation: spin .8s linear infinite; }
  #error { margin: 20px 0 0; padding: 14px 16px; color: #8b3028; border: 1px solid #f1cfc7; border-radius: 12px; background: #fff3f0; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #result { margin-top: 26px; }
  .card { border: 1px solid var(--line); border-radius: 20px; background: var(--paper-solid); box-shadow: 0 15px 50px rgba(36,49,55,.07); }
  .result-card { overflow: hidden; }
  .result-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 22px; padding: 25px 26px 21px; border-bottom: 1px solid #eee9e1; background: linear-gradient(105deg,#fffdf8,#f8f4ec); }
  .result-kicker { margin: 0 0 7px; color: var(--muted); font-size: 11px; font-weight: 750; letter-spacing: .14em; }
  .claim { margin: 0; color: var(--navy-deep); font-size: 22px; font-weight: 750; line-height: 1.45; letter-spacing: -.02em; }
  .reason { max-width: 760px; margin: 13px 0 0; color: #53616a; }
  .verdict-wrap { flex: 0 0 auto; text-align: right; }
  .verdict-wrap::before { content: "结论"; display: block; margin-bottom: 7px; color: var(--muted); font-size: 11px; letter-spacing: .12em; }
  .badge { display: inline-flex; align-items: center; padding: 7px 12px; border-radius: 999px; color: #fff; font-size: 13px; font-weight: 750; white-space: nowrap; box-shadow: 0 5px 11px rgba(30,40,40,.12); }
  .v-真 { background: var(--true); } .v-假 { background: var(--false); }
  .v-说不准 { background: var(--maybe); } .v-没查到可靠来源 { background: var(--none); }
  .result-body { padding: 3px 26px 25px; }
  .content-section { margin-top: 22px; }
  h2 { display: flex; align-items: center; gap: 9px; margin: 0 0 11px; color: var(--navy-deep); font-size: 14px; font-weight: 750; }
  h2::before { content: ""; width: 4px; height: 17px; border-radius: 2px; background: var(--gold); }
  ul { margin: 0; padding-left: 21px; }
  li { margin: 7px 0; }
  .claim-list > li { padding-left: 4px; }
  .source-list { margin-top: 6px; padding: 0; list-style: none; }
  .source-item { display: flex; align-items: baseline; gap: 8px; margin: 6px 0; padding: 9px 11px; border: 1px solid #eee9e0; border-radius: 10px; background: #fcfaf5; }
  .source-item::before { content: "↗"; flex: 0 0 auto; color: var(--gold); font-size: 13px; }
  .source-link { min-width: 0; overflow: hidden; color: var(--navy); font-size: 14px; text-overflow: ellipsis; white-space: nowrap; }
  .meta { color: var(--muted); font-size: 12px; }
  .source-meta { white-space: nowrap; }
  .conflict { margin: 8px 0; padding: 11px 13px; border-left: 3px solid var(--maybe); border-radius: 0 10px 10px 0; background: #fff8e9; }
  .note { color: var(--muted); font-size: 13px; }
  details { margin-top: 15px; border-top: 1px dashed #e3ddd2; }
  summary { padding: 14px 0 2px; color: var(--navy); cursor: pointer; font-size: 13px; font-weight: 650; list-style-position: inside; }
  details ul { padding-bottom: 4px; }
  .result-foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 21px; padding-top: 15px; border-top: 1px solid #eee9e1; }
  button.linkish { padding: 0; color: var(--navy); background: none; font-size: 12px; text-decoration: underline; text-underline-offset: 3px; }
  footer { display: flex; align-items: flex-start; gap: 10px; margin-top: 29px; color: var(--muted); font-size: 12px; }
  footer::before { content: "✦"; color: var(--gold); }
  @media (max-width: 740px) {
    .page-shell { width: min(100% - 28px, 620px); padding-top: 20px; }
    .topbar { margin-bottom: 28px; }
    .top-note { display: none; }
    .hero { grid-template-columns: 1fr; gap: 17px; }
    .hero-copy { padding: 0; }
    h1 { font-size: clamp(39px,13vw,58px); }
    .hero-copy > p { margin-top: 14px; font-size: 16px; }
    .hero-art { min-height: 210px; border-radius: 23px; }
    .orbit { top: 24px; left: 30px; width: 112px; height: 112px; }
    .hero-art-copy { right: 22px; bottom: 21px; left: 22px; }
    .hero-art-title { font-size: 21px; }
    .search-card { padding: 17px; border-radius: 17px; }
    .search-card-head { display: block; }
    .search-card-hint { display: block; margin-top: 3px; }
    form { gap: 8px; }
    input[type=text] { width: 100%; }
    #go { min-width: 74px; padding: 0 12px; }
    .result-head { display: block; padding: 20px 18px 17px; }
    .verdict-wrap { margin-top: 17px; text-align: left; }
    .verdict-wrap::before { display: inline-block; margin: 0 9px 0 0; }
    .claim { font-size: 19px; }
    .result-body { padding: 1px 18px 20px; }
    .result-foot { display: block; }
    .result-foot .meta { margin-bottom: 7px; }
    .source-item { display: block; padding: 8px 10px; }
    .source-item::before { display: inline-block; margin-right: 6px; }
    .source-link { white-space: normal; word-break: break-word; }
    .source-meta { display: block; margin: 3px 0 0 20px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
  }
</style>
</head>
<body>
<main class="page-shell">
  <header class="topbar">
    <a class="brand" href="/" aria-label="AI 侦探首页"><span class="brand-mark" aria-hidden="true"></span><span><strong class="brand-name">AI 侦探</strong><span class="brand-caption">先查，再说</span></span></a>
    <span class="top-note"><span class="live-dot" aria-hidden="true"></span>让每句话都有出处</span>
  </header>
  <section class="hero" aria-labelledby="page-title">
    <div class="hero-copy"><p class="eyebrow">EVIDENCE FIRST</p><h1 id="page-title">把传言，<br>查成事实。</h1><p>把你听到的一句话交给 AI 侦探。它会先搜索、再交叉核对，最后把判断和出处一起交还给你。</p></div>
    <div class="hero-art" aria-hidden="true"><span class="orbit"></span><div class="hero-art-copy"><p class="hero-art-kicker">SEARCH · CHECK · EXPLAIN</p><p class="hero-art-title">答案可以快，证据不能少。</p><div class="hero-art-line"></div></div></div>
  </section>
  <section class="search-card" aria-label="开始查证">
    <div class="search-card-head"><p class="search-card-title">你想查什么？</p><span class="search-card-hint">支持传言、新闻线索和“这是什么”</span></div>
    <form id="form"><input type="text" id="q" maxlength="200" autocomplete="off" placeholder="粘贴一条传言，或描述你想查的事" aria-label="要查证的内容"><button type="submit" id="go">开查</button></form>
    <div class="examples"><span class="examples-label">试试：</span><span id="examples"></span></div>
  </section>
  <div id="progress" role="status" aria-live="polite"></div>
  <div id="error" role="alert" hidden></div>
  <div id="result"></div>
  <footer>搜索由元宝搜索提供。结论仅依据查到的来源，请点开来源自行核对。不查时政话题和个人私事。</footer>
</main>
<script src="/app.js"></script>
</body>
</html>
